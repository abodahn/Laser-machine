<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T&C Laser Intelligence &amp; Command Center</title>
<link rel="stylesheet" href="/static/style.css?v=20">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎯</text></svg>">
</head>
<body>

<div id="login" hidden>
  <form class="box" onsubmit="return doLogin(event)">
    <div class="lg">🎯</div>
    <h2>T&amp;C Laser Command Center</h2>
    <p>Jeanologia laser department &mdash; monitoring &amp; intelligence</p>
    <label>Username</label><input id="lu" autocomplete="username" autofocus>
    <label>Password</label><input id="lp" type="password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="primary" style="width:100%;margin-top:14px;padding:9px">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><div class="logo">🎯</div><div><b>T&amp;C LASER</b><span>Command Center</span></div></div>
    <nav id="nav"></nav>
    <div class="foot">
      <div id="whoami"></div>
      <div style="margin-top:8px;display:flex;gap:6px">
        <button class="sm" onclick="showPassword()">Password</button>
        <button class="sm" onclick="doLogout()">Sign out</button>
      </div>
    </div>
  </aside>
  <div id="main">
    <div id="hdr">
      <div id="critbar">
        <span class="ic">🚨</span><b id="critcount"></b>
        <span class="msg" id="critmsg"></span>
        <button onclick="ackAllCritical()">Acknowledge all</button>
        <button onclick="silence()">Silence</button>
      </div>
      <header id="top">
        <button class="iconbtn" id="burger" onclick="document.body.classList.toggle('navopen')" title="Menu" aria-label="Menu">☰</button>
        <h1 id="title">Command Center</h1>
        <div class="spacer"></div>
        <span class="pill live"><span class="dot"></span><span id="pill-live">&mdash;</span></span>
        <span class="pill" id="pill-alerts">&mdash;</span>
        <span class="pill" id="pill-clock">&mdash;</span>
        <select id="langsel" title="Language" onchange="setLang(this.value)"
                style="width:auto;padding:5px 8px;font-size:11.5px"></select>
        <select id="refreshsel" title="Auto-refresh interval" onchange="setRefresh(this.value)"
                style="width:auto;padding:5px 8px;font-size:11.5px"></select>
        <button class="iconbtn armed" id="soundbtn" title="Critical alarm sound: on" onclick="toggleSound()">🔔</button>
      </header>
    </div>
    <main id="view"></main>
  </div>
</div>

<script src="/static/app.js?v=20"></script>
<script src="/static/wall.js?v=20"></script>
</body>
</html>
