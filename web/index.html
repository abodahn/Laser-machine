<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T&C Laser Intelligence &amp; Command Center</title>
<link rel="stylesheet" href="/static/style.css?v=21">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎯</text></svg>">
<link rel="manifest" href="/manifest.webmanifest?v=21">
<meta name="theme-color" content="#070d18">
<!-- iOS ignores the manifest: it needs its own icon and its own standalone flags -->
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "black", not "black-translucent": translucent lays the page out from y=0 and the
     iOS clock/battery then sit on top of the sticky #top header. Nothing here sets
     viewport-fit=cover or env(safe-area-inset-top), so there is no padding to hide
     behind — and against --bg #070d18 an opaque black bar is indistinguishable anyway. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="T&amp;C Laser">
</head>
<body>

<div id="login" hidden>
  <form class="box" onsubmit="return doLogin(event)">
    <div class="lg">🎯</div>
    <h2>T&amp;C Laser Command Center</h2>
    <p>Jeanologia laser department &mdash; monitoring &amp; intelligence</p>
    <label>Username</label><input id="lu" autocomplete="username" autofocus>
    <label>Password</label><input id="lp" type="password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="primary" style="width:100%;margin-top:14px;padding:9px">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><div class="logo">🎯</div><div><b>T&amp;C LASER</b><span>Command Center</span></div></div>
    <nav id="nav"></nav>
    <div class="foot">
      <div id="whoami"></div>
      <div style="margin-top:8px;display:flex;gap:6px">
        <button class="sm" onclick="showPassword()">Password</button>
        <button class="sm" onclick="doLogout()">Sign out</button>
      </div>
    </div>
  </aside>
  <div id="main">
    <div id="hdr">
      <div id="critbar">
        <span class="ic">🚨</span><b id="critcount"></b>
        <span class="msg" id="critmsg"></span>
        <button onclick="ackAllCritical()">Acknowledge all</button>
        <button onclick="silence()">Silence</button>
      </div>
      <header id="top">
        <button class="iconbtn" id="burger" onclick="document.body.classList.toggle('navopen')" title="Menu" aria-label="Menu">☰</button>
        <h1 id="title">Command Center</h1>
        <div class="spacer"></div>
        <span class="pill live"><span class="dot"></span><span id="pill-live">&mdash;</span></span>
        <span class="pill" id="pill-alerts">&mdash;</span>
        <span class="pill" id="pill-clock">&mdash;</span>
        <button class="iconbtn" id="installbtn">📲</button>
        <select id="langsel" title="Language" onchange="setLang(this.value).then(syncInstall)"
                style="width:auto;padding:5px 8px;font-size:11.5px"></select>
        <select id="refreshsel" title="Auto-refresh interval" onchange="setRefresh(this.value)"
                style="width:auto;padding:5px 8px;font-size:11.5px"></select>
        <button class="iconbtn armed" id="soundbtn" title="Critical alarm sound: on" onclick="toggleSound()">🔔</button>
      </header>
    </div>
    <main id="view"></main>
  </div>
</div>

<script src="/static/app.js?v=21"></script>
<script src="/static/wall.js?v=21"></script>

<script>
/* The worker's version rides on the app.js tag's ?v=, so the single bump in this
   file invalidates the shell, the assets and the service worker together.
   Optional chaining, not a try/catch: on the plain-HTTP factory LAN
   navigator.serviceWorker is undefined, and this has to be a silent no-op there. */
navigator.serviceWorker?.register(
  '/sw.js' + new URL(document.querySelector('script[src*="app.js"]').src).search
).catch(() => {});

/* Install affordance.

   The button used to be revealed only by beforeinstallprompt. That event is a
   Chromium thing: iOS Safari never fires it, so on an iPhone — half the phones on
   the floor — the button simply never appeared and there was no way to install and
   no explanation either. Same on the plain-HTTP LAN address, where install can
   never work at all.

   So the button is always offered, and the CLICK decides what can actually be done
   here. Only two states hide it: already running as an installed app, and a
   just-completed install. */
const ibtn = document.getElementById('installbtn');
let installPrompt = null;

/* t() returns the raw key until the catalogue has loaded, and this can fire before
   that; degrade to English rather than to "laser.pwa.install". */
const tp = (k, en) => { const v = window.t ? t(k) : ''; return v.slice(0, 6) === 'laser.' ? en : v || en; };

const standalone = () => matchMedia('(display-mode: standalone)').matches ||
                         navigator.standalone === true;
/* iPadOS 13+ reports itself as a Mac; the touch-point count is what separates them. */
const isIOS = () => /iphone|ipod|ipad/i.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* called by the language select too — nothing in app.js re-renders the header */
function syncInstall() {
  ibtn.title = ibtn.ariaLabel = tp('laser.pwa.install', 'Install app');
  ibtn.hidden = standalone();
}
syncInstall();

addEventListener('beforeinstallprompt', e => {
  e.preventDefault();          // keep the event so the user can install from our own button
  installPrompt = e;
  syncInstall();
});

function installHelp(bodyHtml) {
  if (window.showModal) showModal(tp('laser.pwa.how', 'Install on this device'), bodyHtml, '');
  else alert(bodyHtml.replace(/<[^>]+>/g, ' '));
}

ibtn.onclick = async () => {
  if (installPrompt) {                      // Chrome/Edge: the real thing
    ibtn.hidden = true;                     // the prompt is single-use whatever the answer
    await installPrompt.prompt();
    installPrompt = null;
    return;
  }
  /* No prompt available. Say why, and what to do instead, rather than doing nothing.
     isSecureContext is the honest test: install is impossible over plain HTTP however
     good the manifest is. */
  if (!window.isSecureContext) {
    installHelp(`<p>${tp('laser.pwa.http',
      'Installing needs the secure online address (https). The local factory address cannot install an app — open the online link on this device and install from there.')}</p>`);
  } else if (isIOS()) {
    installHelp(`<p>${tp('laser.pwa.ios',
      'On iPhone and iPad: tap the Share button in Safari, then choose "Add to Home Screen".')}</p>`);
  } else {
    installHelp(`<p>${tp('laser.pwa.generic',
      'Open your browser menu and choose "Install app" or "Add to Home screen". If you do not see it, the app may already be installed.')}</p>`);
  }
};

addEventListener('appinstalled', () => {
  installPrompt = null;
  ibtn.hidden = true;
  window.toast?.(tp('laser.pwa.installed', 'App installed'), 'ok');
});
</script>
</body>
</html>
